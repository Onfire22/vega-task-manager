services:
  vega-database:
    image: postgres:18-alpine
    container_name: vega-database
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "5432:5432"
    volumes:
      - vega-database:/var/lib/postgresql

  vega-redis:
    image: redis:7-alpine
    container_name: vega-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - vega-redis:/data
    command: redis-server --appendonly yes

volumes:
  vega-database:
    name: vega-database
  vega-redis:
    name: vega-redis